# Configuration for typos-cli (https://github.com/crate-ci/typos)

[files]
# Avoid scanning generated/third-party directories and auto-generated files.
extend-exclude = [
    ".git/**",
    "target/**",
    "coverage/**",
    "coverage_report/**",
    "node_modules/**",
    "dist/**",
    "build/**",
    "venv/**",
    ".venv/**",
    ".mypy_cache/**",
    ".ruff_cache/**",
    ".pytest_cache/**",
    # Auto-generated from git history; contains commit-message fragments that frequently trip spellcheck.
    "CHANGELOG.md",
    "docs/archives/changelog/**",
    # Retained machine evidence includes base64-encoded raw samples, not prose.
    "docs/performance-runs/runs/*/run.json",
    "docs/performance-runs/runs/*/evidence.json",
]

[default]
# Ignore identifier patterns that are common in tests/demos (e.g., symmetry_ab / symmetry_ba).
extend-ignore-identifiers-re = [
    ".*_ba$",
]

[default.extend-identifiers]
# num-rational's numerator accessor, used by the independent exact test oracle.
numer = "numer"

[type.gitleaks]
extend-glob = [ ".gitleaks.toml" ]
# This exact retained numeric prefix is Base64 data; keep checking other text.
extend-ignore-re = [ '''WzE0MTgxLjY4Nzg2NjA5OTg2LDE0MzEyLjk0NjI4NDYxOTUzOCwxNDY2Mi45Njg3MzQwM''' ]

[type.md]
# Generated HTML splits escaped identifiers with zero-width comments. Ignore
# only tokens spanning those comments; ordinary prose remains spell-checked.
extend-ignore-re = [ '''[A-Za-z0-9_;&]+(?:<!--\r?\n-->[A-Za-z0-9_;&]+)+''' ]

[default.extend-words]
# Domain terms that typos suggests "fixing" but are correct in this repo.
bimap = "bimap"
Classe = "Classe"
continus = "continus"
formes = "formes"
Nd = "Nd"
ND = "ND"
PNG = "PNG"
Sur = "Sur"
Udo = "Udo"
