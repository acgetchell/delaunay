name: Set up just
description: Resolve the pinned just version from justfile and install it.

outputs:
  version:
    description: Resolved just version from justfile.
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    - name: Resolve just version
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        if ! version="$(bash .github/actions/setup-just/resolve-version.sh)"; then
          echo "::error::Could not resolve just_version from justfile"
          exit 1
        fi

        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Install just
      uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
      with:
        tool: just@${{ steps.resolve.outputs.version }}
