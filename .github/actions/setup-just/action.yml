name: Set up shared tooling
description: Install and verify the locked PyPI package and declared managed tools.

inputs:
  cache:
    description: Restore and save managed-tool and consumer-build caches.
    default: "true"
  consumer-cache:
    description: Restore and save checkout compilation output; preparation disables this.
    default: "true"
  cache-scope:
    description: Consumer stage owning this compilation cache.
    default: shared
  portable-only:
    description: Install only the tooling for the Linux portable checks.
    default: "false"
  release-only:
    description: Install locked release tooling outside the checkout and select only Cargo.
    default: "false"

runs:
  using: composite
  steps:
    - name: Install declared uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version-file: pyproject.toml
        enable-cache: false

    - name: Select short Windows installation root
      if: runner.os == 'Windows' && inputs.release-only != 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $env:RESEARCH_REPO_TOOLS_HOME = "C:/rrt"
        uv run --locked --managed-python --only-group tooling research-repo-tools ci export RESEARCH_REPO_TOOLS_HOME
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Cache managed Cargo compilation
      if: inputs.cache == 'true' && inputs.release-only != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.os == 'Windows' && 'C:/rrt-build' || format('{0}/rrt-cargo-build', runner.temp) }}
        key: >-
          cargo-build-v1-${{ inputs.portable-only == 'true' && 'portable-' || '' }}${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('pyproject.toml', 'rust-toolchain.toml', 'uv.lock', 'Cargo.lock', '.python-version')
          }}

    - name: Install the locked tooling package
      if: inputs.release-only != 'true'
      shell: bash
      run: uv sync --locked --managed-python --only-group tooling

    - name: Install managed release binaries
      if: inputs.release-only != 'true'
      shell: bash
      env:
        # Only the release API lookup receives this token; child processes do not.
        GH_TOKEN: ${{ github.token }}
        PORTABLE_ONLY: ${{ inputs.portable-only }}
      run: |
        set -euo pipefail
        args=(run --locked --no-sync --no-python-downloads --no-env-file research-repo-tools toolchain)
        if [[ "$PORTABLE_ONLY" == "true" ]]; then
          args+=(sync --tool dprint --tool rumdl)
        else
          args+=(sync-binaries)
        fi
        if ! uv "${args[@]}"; then
          echo "::warning::Retrying managed release binary installation once"
          uv "${args[@]}"
        fi

    - name: Install declared tools from the locked package
      if: inputs.release-only != 'true' && inputs.portable-only != 'true'
      shell: bash
      env:
        RESEARCH_REPO_TOOLS_CARGO_BUILD_HOME: ${{ runner.os == 'Windows' && 'C:/rrt-build' || format('{0}/rrt-cargo-build', runner.temp) }}
      run: |
        set -euo pipefail
        (
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Use HTTP/1.1 for managed Cargo tool installation after hosted HTTP/2 framing errors.
            export CARGO_HTTP_MULTIPLEXING=false
          fi
          uv run --locked --managed-python --only-group tooling research-repo-tools toolchain sync
        )
        uv run --locked --no-sync --no-python-downloads research-repo-tools toolchain run -- uv sync --locked --managed-python --group dev --group notebooks
        uv run --locked --no-sync --no-python-downloads research-repo-tools semgrep setup
        uv run --locked --no-sync --no-python-downloads research-repo-tools toolchain export
        uv run --locked --no-sync --no-python-downloads research-repo-tools --version

    - name: Install and export portable validation tools
      if: inputs.release-only != 'true' && inputs.portable-only == 'true'
      shell: bash
      env:
        RESEARCH_REPO_TOOLS_CARGO_BUILD_HOME: ${{ runner.temp }}/rrt-cargo-build
      run: |
        set -euo pipefail
        cargo_tools=(--tool taplo-cli --tool typos-cli --tool zizmor)
        uv run --locked --no-sync --no-python-downloads research-repo-tools toolchain sync "${cargo_tools[@]}"
        uv run --locked --no-sync --no-python-downloads research-repo-tools toolchain run --tool cargo -- rustup component add rustfmt
        uv sync --locked --managed-python --group dev
        uv run --locked --no-sync --no-python-downloads research-repo-tools semgrep setup
        uv run --locked --no-sync --no-python-downloads research-repo-tools toolchain export "${cargo_tools[@]}" --tool dprint --tool rumdl

    - name: Install locked release tools and export the Cargo selection
      if: inputs.release-only == 'true'
      shell: bash
      run: |
        set -euo pipefail
        environment="$RUNNER_TEMP/release-tools"
        UV_PROJECT_ENVIRONMENT="$environment" uv sync --locked --managed-python --no-default-groups --no-install-project
        bin="$environment/bin"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
            bin="$(cygpath -u "$environment/Scripts")"
        fi
        "$bin/research-repo-tools" toolchain sync --tool cargo
        PATH="$bin:$PATH" "$bin/research-repo-tools" toolchain export --tool cargo

    - name: Cache consumer Rust builds
      if: inputs.cache == 'true' && inputs.consumer-cache == 'true' && inputs.release-only != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          target/debug
          target/release
          target/perf
        key: >-
          rust-build-v2-${{ inputs.cache-scope }}-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('rust-toolchain.toml', '**/Cargo.lock')
          }}-${{ github.sha }}
        restore-keys: >-
          rust-build-v2-${{ inputs.cache-scope }}-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('rust-toolchain.toml', '**/Cargo.lock')
          }}-
