name: Dependabot approval and auto-merge

# Trusted base-branch policy only; the reusable job never checks out or runs PR code.
"on": # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
    branches:
      - main

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  approve-and-enable-auto-merge:
    permissions:
      contents: write
      pull-requests: write
    uses: acgetchell/research-repo-tools/.github/workflows/dependabot-approve.yml@7282cbd90cf5cd0ca8a1c8a01d3fed520f04eb2f # reviewed 2026-10-04
    with:
      repository: acgetchell/delaunay
      policy: >-
        {"cargo": {
          "files": [
            "Cargo.toml",
            "Cargo.lock",
            "tests/fixtures/checkpoint_no_float_roundtrip/Cargo.toml",
            "tests/fixtures/checkpoint_no_float_roundtrip/Cargo.lock"
          ]
        }, "uv": {
          "files": ["pyproject.toml", "uv.lock"]
        }, "github_actions": {
          "files": [
            ".github/actions/setup-just/action.yml",
            ".github/workflows/audit.yml",
            ".github/workflows/benchmarks.yml",
            ".github/workflows/ci.yml",
            ".github/workflows/codacy.yml",
            ".github/workflows/codecov.yml",
            ".github/workflows/codeql.yml",
            ".github/workflows/dependabot-auto-merge.yml",
            ".github/workflows/generate-baseline.yml",
            ".github/workflows/gitleaks.yml",
            ".github/workflows/osv.yml",
            ".github/workflows/papers.yml",
            ".github/workflows/profiling-benchmarks.yml",
            ".github/workflows/release-benchmarks.yml",
            ".github/workflows/rust-clippy.yml",
            ".github/workflows/semgrep-sarif.yml",
            ".github/workflows/zizmor.yml"
          ]
        }}
