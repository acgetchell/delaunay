name: CI
permissions:
  contents: read
concurrency:
  group: >
    ci-${{ github.workflow }}-${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.number ||
      github.ref
    }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Continue other jobs if one fails
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Disable Git autocrlf on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up shared tooling
        id: setup_just
        uses: $/.github/actions/setup-just

      - name: Verify native Rust host
        id: rust-host
        shell: bash
        env:
          EXPECTED_RUST_HOST: ${{ matrix.target }}
        run: |
          set -euo pipefail
          compiler="$(rustc --version --verbose)"
          printf '%s\n' "$compiler"
          actual_host="$(printf '%s\n' "$compiler" | sed -n 's/^host: //p')"
          if [[ "$actual_host" != "$EXPECTED_RUST_HOST" ]]; then
            echo "::error::Rust host $actual_host differs from matrix target $EXPECTED_RUST_HOST."
            exit 1
          fi

      - name: Run CI checks
        run: just ci
