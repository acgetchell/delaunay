name: Release Benchmarks

# Attach the single local acquisition; no job collects benchmark timings.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable tag matching the workflow ref and mutable draft
        required: true
        type: string
      candidate:
        description: Independent owner transfer.json from just release-benchmarks
        required: true
        type: string

concurrency:
  group: release-draft-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  fetch:
    if: >-
      github.repository == 'acgetchell/delaunay' &&
      github.actor == 'acgetchell' && github.triggering_actor == 'acgetchell'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Draft visibility requires push access. Execute no checkout code.
      contents: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      validated-attempt: ${{ github.run_attempt }}
    steps:
      - name: Install trusted package runner
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
          cache-python: false

      - name: Retrieve exact independently selected draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_TRANSFER: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          uvx --python 3.15 \
            --from 'research-repo-tools==0.2.8' \
            python -I - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from research_repo_tools.release_assets import (
              download_release_asset, parse_release_target, publish_release_asset,
              revalidate_release_target,
          )
          root = Path(os.environ["RUNNER_TEMP"])
          data = json.loads(os.environ["CANDIDATE_TRANSFER"])
          target = parse_release_target(json.dumps(data["target"]).encode("utf-8"))
          if (target.repository, target.tag, target.commit, target.expected_title) != (
              "acgetchell/delaunay", os.environ["RELEASE_TAG"], os.environ["GITHUB_SHA"], os.environ["RELEASE_TAG"],
          ) or os.environ["GITHUB_REF"] != "refs/tags/" + target.tag:
              raise ValueError("dispatch differs from independent release target")
          if set(data["assets"]) != {"policy", "publication", "acceptance", "archive"}:
              raise ValueError("attachment requires the original four-asset transfer")
          def check():
              release = revalidate_release_target(root, target)
              for selected in data["assets"].values():
                  entries = [item for item in release.assets if item[0] == selected["name"]]
                  if len(entries) != 1 or type(selected["id"]) is not int or entries[0][1] != selected["id"]:
                      raise ValueError("original candidate asset ID changed")
                  if entries[0][3] is not None and entries[0][3] != selected["sha256"]:
                      raise ValueError("original candidate asset digest changed")
          check()
          directory = root / "incoming-candidate"
          directory.mkdir()
          for role, selected in data["assets"].items():
              destination = directory / ("archive.tar.gz" if role == "archive" else role + ".json")
              download_release_asset(
                  root, target.repository, target.tag, selected["name"], destination,
                  expected_sha256=selected["sha256"], allow_draft=True,
              )
          check()
          PY

      - name: Upload inert candidate input
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/incoming-candidate/
          retention-days: 30
          if-no-files-found: error

  verify:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      validated-attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up declared tools without caches
        uses: $/.github/actions/setup-just
        with:
          cache: "false"

      - name: Prepare dependency provenance before inspection
        run: just release-dependency-builds

      - name: Require this retrieval attempt
        env:
          VALIDATED_ATTEMPT: ${{ needs.fetch.outputs.validated-attempt }}
          ARTIFACT_ID: ${{ needs.fetch.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.fetch.outputs.artifact-digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VALIDATED_ATTEMPT" == "$GITHUB_RUN_ATTEMPT" ]] || exit 1
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
            | jq -e --arg digest "sha256:$ARTIFACT_DIGEST" --arg run "$GITHUB_RUN_ID" \
              '.expired == false and .digest == $digest and (.workflow_run.id | tostring) == $run' >/dev/null

      - name: Download exact candidate input
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.fetch.outputs.artifact-id }}
          path: ${{ runner.temp }}/incoming-candidate
          merge-multiple: true

      - name: Verify original acquisition and full frozen acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_TRANSFER: ${{ inputs.candidate }}
        run: just release-receive "$RUNNER_TEMP/accepted-candidate" --incoming "$RUNNER_TEMP/incoming-candidate"

      - name: Upload verified inert archive
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accepted-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/accepted-candidate/
          retention-days: 30
          if-no-files-found: error

  attach:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      # No checkout or repository code runs with attachment credentials.
      - name: Install trusted package runner
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
          cache-python: false

      - name: Require this exact verification attempt and artifact
        env:
          VALIDATED_ATTEMPT: ${{ needs.verify.outputs.validated-attempt }}
          ARTIFACT_ID: ${{ needs.verify.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact-digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VALIDATED_ATTEMPT" == "$GITHUB_RUN_ATTEMPT" ]] || exit 1
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
            | jq -e --arg digest "sha256:$ARTIFACT_DIGEST" --arg run "$GITHUB_RUN_ID" \
              '.expired == false and .digest == $digest and (.workflow_run.id | tostring) == $run' >/dev/null

      - name: Download the exact verified artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: ${{ runner.temp }}/accepted-candidate
          merge-multiple: true

      - name: Attach the original accepted archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_TRANSFER: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          uvx --python 3.15 \
            --from 'research-repo-tools==0.2.8' \
            python -I - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from research_repo_tools.release_assets import (
              download_release_asset, parse_release_target, publish_release_asset,
              revalidate_release_target,
          )
          root = Path(os.environ["RUNNER_TEMP"])
          data = json.loads(os.environ["CANDIDATE_TRANSFER"])
          target = parse_release_target(json.dumps(data["target"]).encode("utf-8"))
          if (target.repository, target.tag, target.commit, target.expected_title) != (
              "acgetchell/delaunay", os.environ["RELEASE_TAG"], os.environ["GITHUB_SHA"], os.environ["RELEASE_TAG"],
          ) or os.environ["GITHUB_REF"] != "refs/tags/" + target.tag:
              raise ValueError("dispatch differs from independent release target")
          if set(data["assets"]) != {"policy", "publication", "acceptance", "archive"}:
              raise ValueError("attachment requires the original four-asset transfer")
          def check():
              release = revalidate_release_target(root, target)
              for selected in data["assets"].values():
                  entries = [item for item in release.assets if item[0] == selected["name"]]
                  if len(entries) != 1 or type(selected["id"]) is not int or entries[0][1] != selected["id"]:
                      raise ValueError("original candidate asset ID changed")
                  if entries[0][3] is not None and entries[0][3] != selected["sha256"]:
                      raise ValueError("original candidate asset digest changed")
          check()
          directory = root / "accepted-candidate"
          artifact = directory / f"delaunay-{target.tag}-criterion-baseline.tar.gz"
          for role, path in (("acceptance", directory / "acceptance.json"), ("archive", artifact)):
              if path.is_symlink() or hashlib.sha256(path.read_bytes()).hexdigest() != data["assets"][role]["sha256"]:
                  raise ValueError("verified artifact differs from independent dispatch assertion")
          publish_release_asset(root, target.repository, target.tag, artifact, target=target)
          check()
          PY
