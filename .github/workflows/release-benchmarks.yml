name: Release Benchmarks

# Archive perf-profile Criterion benchmark baselines as durable GitHub Release
# assets used by the performance-regression workflow for current-vs-latest
# released-version comparisons.

permissions:
  contents: write

on:
  release:
    types:
      - published

concurrency:
  group: release-benchmarks-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          cache-bin: false

      - name: Set up just
        id: setup_just
        uses: ./.github/actions/setup-just

      - name: Resolve uv version
        id: uv_version
        shell: bash
        run: |
          set -euo pipefail

          version="$(just --evaluate uv_version)"
          if [[ -z "$version" ]]; then
            echo "::error::Could not resolve uv_version from justfile"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ steps.uv_version.outputs.version }}
          enable-cache: false

      - name: Verify uv installation
        run: uv --version

      - name: Generate release benchmark summary
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          trusted_tag_re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$RELEASE_TAG" =~ $trusted_tag_re ]]; then
            echo "❌ Release benchmark assets require a semver tag, got: $RELEASE_TAG" >&2
            exit 1
          fi

          mkdir -p release-benchmark-artifacts
          just bench-latest 3600
          uv run --locked benchmark-utils generate-summary \
            --strict \
            --output release-benchmark-artifacts/PERFORMANCE_RESULTS.md
          uv run --locked benchmark-utils write-baseline \
            --ref "$RELEASE_TAG" \
            --output release-benchmark-artifacts/baseline_results.txt

      - name: Package release Criterion baseline
        id: package-baseline
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! -d target/criterion ]]; then
            echo "❌ target/criterion was not generated by the release benchmark run" >&2
            exit 1
          fi

          cp -r target/criterion release-benchmark-artifacts/criterion
          uv run --locked benchmark-utils create-release-benchmark-metadata \
            --tag "$RELEASE_TAG" \
            --criterion-dir release-benchmark-artifacts/criterion \
            --output release-benchmark-artifacts/metadata.json

          asset="delaunay-${RELEASE_TAG}-criterion-baseline.tar.gz"
          tar -czf "$asset" -C release-benchmark-artifacts .
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload temporary release benchmark artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-benchmark-baseline-${{ github.event.release.tag_name }}
          path: ${{ steps.package-baseline.outputs.asset }}
          retention-days: 30
          if-no-files-found: error

      - name: Attach baseline to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ASSET: ${{ steps.package-baseline.outputs.asset }}
        run: |
          set -euo pipefail

          gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" --clobber

      - name: Release benchmark summary
        env:
          RELEASE_ASSET: ${{ steps.package-baseline.outputs.asset }}
        run: |
          set -euo pipefail

          {
            echo "### Release Benchmark Baseline"
            echo ""
            echo "Uploaded release asset: \`$RELEASE_ASSET\`"
            echo ""
            echo "The archive contains:"
            echo ""
            echo "- \`PERFORMANCE_RESULTS.md\`"
            echo "- \`baseline_results.txt\`"
            echo "- raw release-signal Criterion data under \`criterion/\`"
            echo "- \`metadata.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
