name: Comprehensive Profiling Benchmarks

# Diagnostic profiling is opt-in. Public API performance is owned by
# benchmarks.yml and release-benchmarks.yml through the same measurement plan.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Profiling scale (production can take hours)"
        required: true
        default: "development"
        type: choice
        options:
          - "development"
          - "production"
      suite:
        description: "Measure timings or instrumented allocations, once"
        required: true
        default: "timing"
        type: choice
        options:
          - "timing"
          - "allocations"
      benchmark_filter:
        description: "Timing regex or exact allocation case ID; blank selects the suite"
        required: false
        default: ""
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  comprehensive-profiling:
    name: Comprehensive Performance Profiling
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up shared tooling
        uses: $/.github/actions/setup-just

      - name: Select diagnostic workload
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SUITE: ${{ inputs.suite }}
          INPUT_FILTER: ${{ inputs.benchmark_filter }}
        run: |
          set -euo pipefail
          if [[ "$INPUT_SUITE" == "allocations" ]]; then
            selected_filter="${INPUT_FILTER:-memory_profiling}"
            if [[ "$selected_filter" != "memory_profiling" && "$selected_filter" != memory_profiling/* ]]; then
              echo "Allocation filters must select memory_profiling or a case within it." >&2
              exit 2
            fi
          else
            selected_filter="$INPUT_FILTER"
            if [[ "$selected_filter" == memory_profiling* ]]; then
              echo "Select the allocations suite to measure memory_profiling." >&2
              exit 2
            fi
          fi
          # Filters are single-line argv values, never shell source or env-file records.
          if [[ "$selected_filter" == *$'\n'* || "$selected_filter" == *$'\r'* || "$selected_filter" == -* ]]; then
            echo "Invalid benchmark filter." >&2
            exit 2
          fi
          {
            echo "BENCH_FILTER_VALUE=$selected_filter"
            echo "PROFILE_METADATA_MODE=$INPUT_MODE"
            echo "PROFILE_METADATA_SUITE=$INPUT_SUITE"
            echo "BENCH_SAMPLE_SIZE=10"
            echo "BENCH_WARMUP_SECS=2"
            echo "BENCH_MEASUREMENT_TIME=3"
          } >> "$GITHUB_ENV"
          if [[ "$INPUT_MODE" == "development" ]]; then
            echo "PROFILING_DEV_MODE=1" >> "$GITHUB_ENV"
          else
            echo "BENCH_LARGE_SCALE=1" >> "$GITHUB_ENV"
          fi

      - name: Capture profiling environment metadata
        run: uv run --locked --no-sync delaunay-profile-metadata

      - name: Run allocation API tests
        if: inputs.suite == 'allocations'
        run: cargo test --locked --test allocation_api --features count-allocations

      - name: Measure selected diagnostic suite once
        env:
          INPUT_SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          mkdir -p profiling-results
          cargo_args=(bench --locked --profile perf --bench profiling_suite)
          criterion_args=(--noplot)
          if [[ "$INPUT_SUITE" == "allocations" ]]; then
            cargo_args+=(--features count-allocations)
            if [[ "$BENCH_FILTER_VALUE" == "memory_profiling" ]]; then
              criterion_args+=('^memory_profiling/')
            else
              criterion_args+=(--exact "$BENCH_FILTER_VALUE")
            fi
          elif [[ -n "$BENCH_FILTER_VALUE" ]]; then
            criterion_args+=("$BENCH_FILTER_VALUE")
          fi
          cargo "${cargo_args[@]}" -- "${criterion_args[@]}" 2>&1 | tee profiling-results/profiling_output.log

      - name: Summarize diagnostic run
        run: |
          {
            echo "### Diagnostic profiling"
            echo ""
            echo "One selected suite was measured; no release baseline was published."
            echo "See environment.json and profiling_output.log for the configuration and results."
            echo "Instrumented allocation timings are not comparable to uninstrumented API timings."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload profiling results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profiling-results-${{ github.run_number }}
          path: |
            profiling-results/
            target/criterion/
          retention-days: 30
