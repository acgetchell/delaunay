name: Papers

permissions:
  contents: read

concurrency:
  group: >
    papers-${{ github.workflow }}-${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.number ||
      github.ref
    }}
  cancel-in-progress: true

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  papers:
    runs-on: macos-latest
    # A cold managed-tool installation took 53 minutes on the macOS CI runner.
    # Allow bootstrap and artifact checks to finish without relying on a cache.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up shared tooling
        id: setup_just
        uses: $/.github/actions/setup-just

      - name: Cache Homebrew downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-papers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/papers.yml') }}
          restore-keys: homebrew-papers-${{ runner.os }}-${{ runner.arch }}-

      - name: Install paper system dependencies
        shell: bash
        run: bash papers/ci-setup.sh

      - name: Resolve Tectonic bundle cache
        id: tectonic_cache
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$(
            uv run --locked --group dev --group papers research-repo-tools \
              --root . --config papers/tooling.toml toolchain run -- tectonic -X show user-cache-dir
          )"
          if [[ -z "$cache_dir" ]]; then
            echo "::error::Tectonic returned an empty user cache directory."
            exit 1
          fi
          mkdir -p "$cache_dir"
          echo "path=$cache_dir" >> "$GITHUB_OUTPUT"
          uv run --locked --group papers python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("papers/tooling.toml").read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write("version=" + config["toolchain"]["cargo"]["tectonic"] + "\n")
          PY

      - name: Cache Tectonic bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tectonic_cache.outputs.path }}
          key: tectonic-bundle-${{ runner.os }}-${{ runner.arch }}-${{ steps.tectonic_cache.outputs.version }}

      - name: Warm Tectonic bundle cache
        shell: bash
        run: bash papers/ci-warmup.sh

      - name: Build and compare papers
        run: |
          just validation-doc-figures-check
          just paper-artifact-check
