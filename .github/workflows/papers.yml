name: Papers

permissions:
  contents: read

concurrency:
  group: >
    papers-${{ github.workflow }}-${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.number ||
      github.ref
    }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/papers.yml"
      - ".github/actions/setup-just/**"
      - "scripts/tectonic_native_dependencies.sh"
      - ".python-version"
      - "Cargo.lock"
      - "Cargo.toml"
      - "docs/assets/validation/**"
      - "just/**"
      - "justfile"
      - "notebooks/01_validation.ipynb"
      - "papers/**"
      - "pyproject.toml"
      - "rust-toolchain.toml"
      - "scripts/paper_check.py"
      - "scripts/paper_pdf_normalize.py"
      - "scripts/paper_source_date.py"
      - "scripts/subprocess_utils.py"
      - "scripts/notebook_utils.py"
      - "scripts/notebook_validation.py"
      - "scripts/notebook_validation_rendering.py"
      - "scripts/notebook_visualization.py"
      - "scripts/tests/test_paper_check.py"
      - "scripts/tests/test_paper_pdf_normalize.py"
      - "scripts/tests/test_paper_source_date.py"
      - "src/**"
      - "uv.lock"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/papers.yml"
      - ".github/actions/setup-just/**"
      - "scripts/tectonic_native_dependencies.sh"
      - ".python-version"
      - "Cargo.lock"
      - "Cargo.toml"
      - "docs/assets/validation/**"
      - "just/**"
      - "justfile"
      - "notebooks/01_validation.ipynb"
      - "papers/**"
      - "pyproject.toml"
      - "rust-toolchain.toml"
      - "scripts/paper_check.py"
      - "scripts/paper_pdf_normalize.py"
      - "scripts/paper_source_date.py"
      - "scripts/subprocess_utils.py"
      - "scripts/notebook_utils.py"
      - "scripts/notebook_validation.py"
      - "scripts/notebook_validation_rendering.py"
      - "scripts/notebook_visualization.py"
      - "scripts/tests/test_paper_check.py"
      - "scripts/tests/test_paper_pdf_normalize.py"
      - "scripts/tests/test_paper_source_date.py"
      - "src/**"
      - "uv.lock"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  papers:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up shared tooling
        id: setup_just
        uses: $/.github/actions/setup-just

      - name: Cache Homebrew downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-papers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/papers.yml') }}
          restore-keys: homebrew-papers-${{ runner.os }}-${{ runner.arch }}-

      - name: Install paper system dependencies
        run: |
          if ! command -v tlmgr >/dev/null; then
            brew install --cask basictex
          fi
          export PATH="/Library/TeX/texbin:$PATH"
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
          if ! command -v chktex >/dev/null; then
            sudo "$(command -v tlmgr)" update --self
            sudo "$(command -v tlmgr)" install chktex
          fi

      - name: Resolve Tectonic bundle cache
        id: tectonic_cache
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$(tectonic -X show user-cache-dir)"
          if [[ -z "$cache_dir" ]]; then
            echo "::error::Tectonic returned an empty user cache directory."
            exit 1
          fi
          mkdir -p "$cache_dir"
          echo "path=$cache_dir" >> "$GITHUB_OUTPUT"

      - name: Cache Tectonic bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tectonic_cache.outputs.path }}
          key: tectonic-bundle-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup_just.outputs.tectonic-version }}

      - name: Warm Tectonic bundle cache
        shell: bash
        run: |
          set -euo pipefail
          warmup_dir="$RUNNER_TEMP/tectonic-warmup"
          warmup_source="$warmup_dir/warmup.tex"
          mkdir -p "$warmup_dir"
          printf '%s\n' \
            '\documentclass{article}' \
            '\begin{document}' \
            'Tectonic bundle cache warmup.' \
            '\end{document}' > "$warmup_source"

          for attempt in 1 2 3 4; do
            if tectonic --outdir "$warmup_dir" "$warmup_source"; then
              exit 0
            fi
            if [[ "$attempt" -eq 4 ]]; then
              echo "::error::Unable to warm the Tectonic bundle cache after $attempt attempts."
              exit 1
            fi
            delay=$((attempt * 15))
            echo "::warning::Tectonic bundle download failed; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Build and compare papers
        run: |
          just validation-doc-figures-check
          just paper-artifact-check
