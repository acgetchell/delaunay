name: Papers

permissions:
  contents: read

concurrency:
  group: >
    papers-${{ github.workflow }}-${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.number ||
      github.ref
    }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/papers.yml"
      - ".github/actions/setup-just/action.yml"
      - "docs/assets/validation/**"
      - "justfile"
      - "notebooks/01_validation.ipynb"
      - "papers/**"
      - "pyproject.toml"
      - "scripts/paper_check.py"
      - "scripts/paper_pdf_normalize.py"
      - "scripts/paper_source_date.py"
      - "scripts/notebook_utils.py"
      - "scripts/notebook_validation.py"
      - "scripts/notebook_visualization.py"
      - "scripts/tests/test_paper_check.py"
      - "scripts/tests/test_paper_pdf_normalize.py"
      - "scripts/tests/test_paper_source_date.py"
      - "uv.lock"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/papers.yml"
      - ".github/actions/setup-just/action.yml"
      - "docs/assets/validation/**"
      - "justfile"
      - "notebooks/01_validation.ipynb"
      - "papers/**"
      - "pyproject.toml"
      - "scripts/paper_check.py"
      - "scripts/paper_pdf_normalize.py"
      - "scripts/paper_source_date.py"
      - "scripts/notebook_utils.py"
      - "scripts/notebook_validation.py"
      - "scripts/notebook_visualization.py"
      - "scripts/tests/test_paper_check.py"
      - "scripts/tests/test_paper_pdf_normalize.py"
      - "scripts/tests/test_paper_source_date.py"
      - "uv.lock"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  papers:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: true
          cache-bin: false

      - name: Set up just
        id: setup_just
        uses: ./.github/actions/setup-just

      - name: Export paper tool versions
        id: tool_versions
        shell: bash
        run: |
          set -euo pipefail

          resolve_version() {
            local name="$1"
            local value

            if ! value="$(just --evaluate "$name")"; then
              echo "::error::Failed to resolve $name from justfile" >&2
              return 1
            fi
            if [[ -z "$value" ]]; then
              echo "::error::Resolved empty $name from justfile" >&2
              return 1
            fi

            printf '%s\n' "$value"
          }

          tectonic_version="$(resolve_version tectonic_version)"
          tex_fmt_version="$(resolve_version tex_fmt_version)"
          uv_version="$(resolve_version uv_version)"

          {
            echo "TECTONIC_VERSION=$tectonic_version"
            echo "TEX_FMT_VERSION=$tex_fmt_version"
            echo "UV_VERSION=$uv_version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ steps.tool_versions.outputs.UV_VERSION }}
          enable-cache: true
          prune-cache: true

      - name: Sync Python tooling
        run: uv sync --locked --group dev --group notebooks

      - name: Cache Homebrew downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-papers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/papers.yml') }}
          restore-keys: homebrew-papers-${{ runner.os }}-${{ runner.arch }}-

      - name: Install paper system dependencies
        run: |
          brew update
          brew install freetype graphite2 icu4c libpng pkgconf zlib
          icu_pkg_config="$(brew --prefix icu4c)/lib/pkgconfig"
          zlib_pkg_config="$(brew --prefix zlib)/lib/pkgconfig"
          export PKG_CONFIG_PATH="$icu_pkg_config:$zlib_pkg_config${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          if ! command -v tlmgr >/dev/null; then
            brew install --cask basictex
          fi
          export PATH="/Library/TeX/texbin:$PATH"
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
          if ! command -v chktex >/dev/null; then
            sudo "$(command -v tlmgr)" update --self
            sudo "$(command -v tlmgr)" install chktex
          fi

      - name: Install Tectonic
        uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: tectonic@${{ steps.tool_versions.outputs.TECTONIC_VERSION }}

      - name: Resolve Tectonic bundle cache
        id: tectonic_cache
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$(tectonic -X show user-cache-dir)"
          if [[ -z "$cache_dir" ]]; then
            echo "::error::Tectonic returned an empty user cache directory."
            exit 1
          fi
          mkdir -p "$cache_dir"
          echo "path=$cache_dir" >> "$GITHUB_OUTPUT"

      - name: Cache Tectonic bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tectonic_cache.outputs.path }}
          key: tectonic-bundle-${{ runner.os }}-${{ runner.arch }}-${{ steps.tool_versions.outputs.TECTONIC_VERSION }}

      - name: Warm Tectonic bundle cache
        shell: bash
        run: |
          set -euo pipefail
          warmup_dir="$RUNNER_TEMP/tectonic-warmup"
          warmup_source="$warmup_dir/warmup.tex"
          mkdir -p "$warmup_dir"
          printf '%s\n' \
            '\documentclass{article}' \
            '\begin{document}' \
            'Tectonic bundle cache warmup.' \
            '\end{document}' > "$warmup_source"

          for attempt in 1 2 3 4; do
            if tectonic --outdir "$warmup_dir" "$warmup_source"; then
              exit 0
            fi
            if [[ "$attempt" -eq 4 ]]; then
              echo "::error::Unable to warm the Tectonic bundle cache after $attempt attempts."
              exit 1
            fi
            delay=$((attempt * 15))
            echo "::warning::Tectonic bundle download failed; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Install tex-fmt
        uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: tex-fmt@${{ steps.tool_versions.outputs.TEX_FMT_VERSION }}

      - name: Build and compare papers
        run: |
          just validation-doc-figures
          just paper-artifact-check

      - name: Verify paper figures are current
        run: |
          if [[ -n "$(git status --porcelain -- docs/assets/validation)" ]]; then
            git status --short -- docs/assets/validation
            echo "::error::Paper figures changed after 'just validation-doc-figures'."
            echo "Run 'just validation-doc-figures' and commit the regenerated PNG outputs."
            exit 1
          fi
