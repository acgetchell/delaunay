name: "Audit dependencies"
on:
  push:
    paths:
      # Run if workflow changes
      - .github/workflows/audit.yml
      - .github/actions/setup-just/**
      - "scripts/tectonic_native_dependencies.sh"
      # Run if tool-version source changes
      - justfile
      - pyproject.toml
      - uv.lock
      - .python-version
      - rust-toolchain.toml
      # Run on changed dependencies
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  pull_request:
    paths:
      # Run if workflow changes
      - .github/workflows/audit.yml
      - .github/actions/setup-just/**
      - "scripts/tectonic_native_dependencies.sh"
      # Run if tool-version source changes
      - justfile
      - pyproject.toml
      - uv.lock
      - .python-version
      - rust-toolchain.toml
      # Run on changed dependencies
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  # Rerun periodically to pick up new advisories (weekly instead of daily)
  schedule:
    - cron: "0 6 * * 1" # Monday at 6 AM UTC
  # Run manually
  workflow_dispatch:

# Security: Define minimal required permissions
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up shared tooling
        uses: $/.github/actions/setup-just

      - name: Cache audit database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CARGO_HOME }}/advisory-db
          key: advisory-db-${{ github.ref_name }}-v1
          restore-keys: advisory-db-

      - name: Run cargo audit
        run: |
          set +e
          cargo audit --format sarif > audit-results.sarif
          sarif_status=$?
          cargo audit --json > audit-results.json
          json_status=$?
          # Show human-readable output as well
          cargo audit
          terminal_status=$?

          if [ "$sarif_status" -ne 0 ]; then
            exit "$sarif_status"
          fi
          if [ "$json_status" -ne 0 ]; then
            exit "$json_status"
          fi
          exit "$terminal_status"
      - name: Upload audit SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: audit-results.sarif
          category: "cargo-audit"
          wait-for-processing: true

      - name: Upload audit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: audit-results
          path: |
            audit-results.json
            audit-results.sarif
