name: OSV-Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: OSV dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Cold managed-tool builds can take 35 minutes after a Rust upgrade.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up shared tooling
        uses: $/.github/actions/setup-just

      - name: Audit maintained lockfiles
        id: scan
        run: just audit

      - name: Retain dependency scan reports
        if: ${{ !cancelled() && steps.scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-reports
          path: target/security/osv-*
          if-no-files-found: error
          retention-days: 7
