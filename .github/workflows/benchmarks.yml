name: Performance Regression Testing

# Run performance regression testing on important changes
# Security: All GitHub context variables are passed through safe environment variables
# to prevent code injection attacks via malicious branch names or commit data
on:
  # Manual trigger
  workflow_dispatch:

  # Pull requests to main branch
  pull_request:
    branches:
      - main
    # Only run on changes that could affect performance
    paths:
      - ".github/workflows/benchmarks.yml"
      - ".github/actions/setup-just/**"
      - ".python-version"
      - "justfile"
      - "pyproject.toml"
      - "rust-toolchain.toml"
      - "tooling/python/benchmark_models.py"
      - "tooling/python/benchmark_utils.py"
      - "tooling/python/performance_artifacts.py"
      - "src/**"
      - "benches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "uv.lock"

  # On pushes to main branch
  push:
    branches:
      - main
    # Only run on changes that could affect performance
    paths:
      - ".github/workflows/benchmarks.yml"
      - ".github/actions/setup-just/**"
      - ".python-version"
      - "justfile"
      - "pyproject.toml"
      - "rust-toolchain.toml"
      - "tooling/python/benchmark_models.py"
      - "tooling/python/benchmark_utils.py"
      - "tooling/python/performance_artifacts.py"
      - "src/**"
      - "benches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "uv.lock"

# Security: Define minimal required permissions
permissions:
  contents: read

concurrency:
  group: perf-regress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DELAUNAY_BENCH_DISCOVER_SEEDS_LIMIT: 256 # fallback only; ci_performance_suite uses pre-computed seeds

jobs:
  performance-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 150 # Fresh baseline and current runs, including cold compilation.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Resolve the published baseline and disposable measurement checkouts.
          persist-credentials: false

      - name: Set up shared tooling
        id: setup_just
        uses: $/.github/actions/setup-just

      - name: Verify uv installation
        run: uv --version

      - name: Measure current and baseline in one job
        env:
          GH_TOKEN: ${{ github.token }}
        run: just performance-local

      - name: Upload performance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-regression-results-${{ github.run_number }}
          path: target/bench-reports/performance.*
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### Performance comparison"
            echo ""
            echo "Both revisions were measured freshly in this job."
            echo "Ratios require matching harness, measurement plan, toolchain, and host evidence."
            echo "The artifact contains medians, marginal confidence intervals, coverage, and provenance."
            echo "Timing changes are descriptive estimates; this workflow does not apply a regression threshold."
          } >> "$GITHUB_STEP_SUMMARY"
