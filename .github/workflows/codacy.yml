# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, runs selected Codacy engines, and integrates
# the results with GitHub Advanced Security code scanning.
# For more information on the Codacy analysis action usage and
# parameters, see https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Quality Scan

concurrency:
  # This concurrency group ensures that only one Codacy analysis runs at a time
  group: codacy-${{ github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["main"]
  schedule:
    - cron: "42 0 * * 1"

permissions:
  contents: read

jobs:
  codacy-quality-scan:
    permissions:
      # for actions/checkout to fetch code
      contents: read
      # for github/codeql-action/upload-sarif to upload SARIF results
      security-events: write
      # only required for a private repository by
      # github/codeql-action/upload-sarif to get the Action run status
      actions: read
    name: Codacy ${{ matrix.tool }} Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tool:
          # Upload only repository-owned rules to GitHub Code Scanning.
          # Advisory quality engines stay in local/Codacy checks so they do
          # not create empty Security/Quality tool configurations.
          - opengrep
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up declared uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: pyproject.toml
          enable-cache: false

      - name: Install the locked tooling package
        run: uv sync --locked --managed-python --only-group tooling

      - name: Set Codacy paths
        run: |
          set -euo pipefail
          {
            echo "CODACY_WORKDIR=$RUNNER_TEMP/codacy-src"
            echo "CODACY_SARIF=$RUNNER_TEMP/results-${{ matrix.tool }}.sarif"
          } >> "$GITHUB_ENV"

      - name: Prepare workspace copy without .git
        run: |
          set -euo pipefail
          mkdir -p "$CODACY_WORKDIR"
          rsync -a --delete --exclude '.git' ./ "$CODACY_WORKDIR/"

      # Execute Codacy Analysis CLI with one selected tool per matrix entry.
      # Opengrep should mirror repository-owned rules from semgrep.yaml. The
      # SARIF splitter below defensively drops any default Codacy/OpenGrep
      # findings whose rule IDs do not belong to this repository.
      - name: Run Codacy Analysis CLI
        # Cap Codacy runtime so a hung analyzer does not consume the full job timeout.
        timeout-minutes: 20
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token
          # to get your project token from your Codacy repository.
          # You can also omit the token and run the tools that support
          # default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          directory: ${{ env.CODACY_WORKDIR }}
          output: ${{ env.CODACY_SARIF }}
          format: sarif
          tool: ${{ matrix.tool }}
          skip-uncommitted-files-check: true
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will handover control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647

      # Codacy 7.9.25 indexes security and non-security rules separately and
      # emits -1 for repository rules without a pattern description. Repair
      # those legacy references by ruleId; leave all other SARIF validation to
      # the shared splitter. No findings or metadata are discarded here.
      - name: Normalize Codacy SARIF rule indices
        run: |
          set -euo pipefail
          uv run --locked --no-sync --no-python-downloads python - "$CODACY_SARIF" "$RUNNER_TEMP/normalized-codacy.sarif" <<'PY'
          import json
          import sys
          from pathlib import Path

          document = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for run in document["runs"]:
              driver = run["tool"]["driver"]
              if driver["name"] != "Opengrep (reported by Codacy)":
                  continue
              rules = driver.get("rules", [])
              indices = {rule["id"]: index for index, rule in enumerate(rules)}
              for result in run.get("results", []):
                  old_index = result.get("ruleIndex")
                  rule_id = result.get("ruleId")
                  if type(old_index) is not int or not -1 <= old_index < len(rules):
                      continue
                  if not isinstance(rule_id, str) or not rule_id.strip():
                      continue
                  if rule_id in indices:
                      result["ruleIndex"] = indices[rule_id]
                  elif old_index == -1:
                      del result["ruleIndex"]
          Path(sys.argv[2]).write_text(json.dumps(document, allow_nan=False), encoding="utf-8")
          PY

      - name: Split SARIF runs for upload
        id: sarif
        run: |
          set -euo pipefail
          uv run --locked --no-sync --no-python-downloads research-repo-tools sarif split "$RUNNER_TEMP/normalized-codacy.sarif" \
            --output "$RUNNER_TEMP/codacy-sarif" --github-output "$GITHUB_OUTPUT"

      - name: Upload split SARIF files
        if: steps.sarif.outputs.SARIF_HAS_UPLOADABLE_RUNS == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.sarif.outputs.SARIF_DIRECTORY }}
          category: codacy-${{ matrix.tool }}
          wait-for-processing: true
