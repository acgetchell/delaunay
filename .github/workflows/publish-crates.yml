name: Publish to crates.io

on:
  release:
    types: [published]

permissions:
  contents: read

# Serialize every version and rerun for this crate without cancelling an upload.
concurrency:
  group: publish-crates-delaunay
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    if: >-
      github.repository == 'acgetchell/delaunay' &&
      github.event_name == 'release' && github.event.action == 'published' &&
      !github.event.release.draft && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up declared tools without caches
        uses: $/.github/actions/setup-just
        with:
          cache: "false"

      - name: Require reviewed release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: just release-gate "$RELEASE_TAG"

      - name: Verify default and all-feature Cargo packages without uploading
        run: just release-package

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: crates-io
    permissions:
      contents: read
      checks: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install declared uv without caches
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: pyproject.toml
          enable-cache: false

      - name: Install locked publication tooling
        run: |
          uv sync --locked --managed-python --only-group tooling --no-install-project
          printf '%s/.venv/bin\n' "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: Install the declared minimal Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(uv run --locked --no-sync python -c \
            'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$toolchain" >> "$GITHUB_ENV"

      - name: Recheck evidence and registry absence after deployment approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          just --set rrt 'uv run --locked --no-sync research-repo-tools' release-gate "$RELEASE_TAG"
          uv run --locked --no-sync research-repo-tools release registry "$RELEASE_TAG" --expect absent

      - name: Obtain a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Repackage the same clean, revalidated source verified by the first job.
      # Build scripts run only in that job, without publication credentials.
      - name: Package and upload verified source without building
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --package delaunay --registry crates-io --no-verify

      - name: Check visibility even after a Cargo upload timeout
        if: ${{ !cancelled() && steps.auth.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: just --set rrt 'uv run --locked --no-sync research-repo-tools' release-verify "$RELEASE_TAG"
