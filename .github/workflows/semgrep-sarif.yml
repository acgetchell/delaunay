name: Repository Rule SARIF

concurrency:
  group: >
    semgrep-sarif-${{ github.workflow }}-${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.number ||
      github.ref
    }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "42 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep-sarif:
    name: Repository Rule SARIF Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Cold managed-tool builds can take 35 minutes after a Rust upgrade.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up shared tooling
        id: setup_just
        uses: $/.github/actions/setup-just

      - name: Run repository Semgrep rules
        id: semgrep
        run: |
          set -euo pipefail
          # A previous valid report is retained on failure. Only this attempt's
          # newly published reports may be uploaded.
          rm -f target/semgrep.attempt.json
          set +e
          just semgrep-scan target/semgrep
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          uv run --locked --no-sync python - <<'PY'
          import json
          import os
          from pathlib import Path

          marker = Path("target/semgrep.attempt.json")
          current = marker.is_file() and json.loads(marker.read_bytes()).get("published") is True
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"report_current={str(current).lower()}\n")
          PY
          exit 0

      - name: Upload SARIF results
        if: >-
          always() &&
          steps.semgrep.outputs.report_current == 'true' &&
          hashFiles('target/semgrep/semgrep.sarif') != '' &&
          (
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          )
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: target/semgrep/semgrep.sarif
          category: semgrep-repository-rules
          wait-for-processing: true

      - name: Fail on repository rule findings
        if: steps.semgrep.outputs.exit_code != '0'
        run: exit 1
