name: Prepare GitHub release

on:
  push:
    tags:
      - v*

permissions:
  contents: read
  actions: read
  checks: read

# All cooperative draft writers serialize by repository/tag without cancellation.
concurrency:
  group: release-draft-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'acgetchell/delaunay'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      artifact-id: ${{ steps.handoff.outputs.artifact-id }}
      artifact-digest: ${{ steps.handoff.outputs.artifact-digest }}
      validated-attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install trusted package runner
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: false
          cache-python: false
      - name: Prepare read-only Cargo dependency inspection
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(uvx --no-config --isolated --python 3.15 --from research-repo-tools==0.3.0 python -I -c \
            'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$toolchain" >> "$GITHUB_ENV"
          RUSTUP_TOOLCHAIN="$toolchain" cargo fetch --locked
          RUSTUP_TOOLCHAIN="$toolchain" cargo fetch --locked --manifest-path tests/fixtures/checkpoint_no_float_roundtrip/Cargo.toml
      - name: Verify tagged source and freeze native evidence and notes
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]]
          commit=$(git --no-pager rev-parse "$GITHUB_REF^{commit}")
          [[ "$commit" == "$GITHUB_SHA" && "$(git --no-pager rev-parse HEAD)" == "$commit" ]]
          git --no-pager merge-base --is-ancestor "$commit" origin/main
          [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')" == main ]]
          mkdir "$RUNNER_TEMP/handoff"
          runtime=(uvx --no-config --isolated --no-cache --python 3.15
            --from 'research-repo-tools==0.3.0' python -I -m research_repo_tools)
          "${runtime[@]}" --root "$GITHUB_WORKSPACE" release assets plan \
            tooling/release-evidence.toml --repository "$GITHUB_REPOSITORY" \
            --event "$GITHUB_EVENT_NAME" --tag "$RELEASE_TAG" --commit "$commit" \
            --output "$RUNNER_TEMP/handoff/handoff.json" --github-output "$GITHUB_OUTPUT"
      - name: Retain inert verified handoff
        id: handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: draft-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/handoff/handoff.json
          if-no-files-found: error
          retention-days: 30

  prepare:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: write
    steps:
      # No checkout, local action, project environment or handoff code executes here.
      - name: Install trusted package runner
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: false
          cache-python: false
      - name: Authenticate handoff and prepare the unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
          HANDOFF_ID: ${{ needs.verify.outputs.artifact-id }}
          HANDOFF_SHA256: ${{ needs.verify.outputs.artifact-digest }}
          VALIDATED_ATTEMPT: ${{ needs.verify.outputs.validated-attempt }}
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "acgetchell/delaunay" ||
                "$GITHUB_RUN_ATTEMPT" != 1 || "$VALIDATED_ATTEMPT" != 1 ||
                "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ||
                "$GITHUB_SHA" != "$RELEASE_COMMIT" ]]; then
            echo "Draft preparation requires the original exact tag push." >&2
            exit 1
          fi
          cat >handoff-policy.toml <<'TOML'
          schema = 1
          repository = "acgetchell/delaunay"
          workflow = ".github/workflows/prepare-release.yml"
          workflow-name = "Prepare GitHub release"
          artifact-prefix = "draft-handoff"

          [[jobs]]
          name = "verify"
          steps = ["Verify tagged source and freeze native evidence and notes", "Retain inert verified handoff"]
          runner-labels = ["ubuntu-latest"]
          TOML
          uvx --no-config --isolated --no-cache --python 3.15 \
            --from 'research-repo-tools==0.3.0' python -I -m research_repo_tools \
            release assets prepare-authenticated handoff-policy.toml \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" \
            --run-id "$GITHUB_RUN_ID" --attempt 1 --artifact-id "$HANDOFF_ID" --artifact-sha256 "$HANDOFF_SHA256" \
            --executing-run-id "$GITHUB_RUN_ID" --executing-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/draft-state" --approve
      - name: Retain journal even after an unconfirmed creation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: draft-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/draft-state/draft-receipt.json
            ${{ runner.temp }}/draft-state/target.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain complete authenticated preparation state
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: draft-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/draft-state/*
          if-no-files-found: ignore
          retention-days: 30
