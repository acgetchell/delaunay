schema = 2
document = "README.md"
archive = "docs/performance-runs"
measurement = "tooling/measurement-release-signal.toml"
release = true
trial = 1
repository = "acgetchell/delaunay"
tag-policy = "prepare"
begin = "<!-- PERFORMANCE_RELEASE_TABLE:BEGIN -->"
end = "<!-- PERFORMANCE_RELEASE_TABLE:END -->"
statistic = "median"
unit = "ns"
missing = "error"
csv = "docs/assets/bench/release-performance.csv"
rows = [
    { key = "2d", label = "2D construction (500 vertices)" },
    { key = "3d", label = "3D construction (100 vertices)" },
    { key = "4d", label = "4D construction (30 vertices)" },
    { key = "5d", label = "5D construction (12 vertices)" },
]
series = [
    { name = "release-signal/baseline", label = "Baseline", label-version = "release", rows = { "2d" = "tds_new_2d/tds_new/500", "3d" = "tds_new_3d/tds_new/100", "4d" = "tds_new_4d/tds_new/30", "5d" = "tds_new_5d/tds_new/12" } },
    { name = "release-signal/current", label = "Current", label-version = "release", rows = { "2d" = "tds_new_2d/tds_new/500", "3d" = "tds_new_3d/tds_new/100", "4d" = "tds_new_4d/tds_new/30", "5d" = "tds_new_5d/tds_new/12" } },
]
comparisons = [ { numerator = "release-signal/baseline", denominator = "release-signal/current" } ]
references = [
    { path = "Cargo.toml", pattern = '^version = "(?P<value>[^"]+)"\r?$', source = "version" },
    { path = "docs/performance_current.md", pattern = '^- current: available .*; release (?P<value>[^;]+); revision', source = "tag" },
    { path = "docs/performance_current.md", pattern = '^- baseline: available .*; release (?P<value>[^;]+); revision', source = "previous-tag" },
]

[table]
comparison-columns = [ "ratio" ]
ratio-headings = [ "Baseline / current" ]
intervals = "below"
timing-legend = true

[provenance.baseline]
[provenance.current]
