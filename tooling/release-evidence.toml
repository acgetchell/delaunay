schema = 1
repository = "acgetchell/delaunay"
package = "delaunay"
workflow = ".github/workflows/ci.yml"
workflow-name = "CI"
branch = "main"
artifact-prefix = "cargo-package"
guarantee = "cargo-archive"
path-in-vcs = ""

[[jobs]]
name = "portable"
steps = [ "Run portable checks" ]
runner-labels = [ "ubuntu-latest" ]

[[jobs]]
name = "build (ubuntu-latest)"
steps = [ "Verify native Rust host", "Run CI checks" ]
runner-labels = [ "ubuntu-latest" ]

[[jobs]]
name = "build (macos-latest)"
steps = [ "Verify native Rust host", "Run CI checks" ]
runner-labels = [ "macos-latest" ]

[[jobs]]
name = "build (windows-latest)"
steps = [ "Verify native Rust host", "Run CI checks" ]
runner-labels = [ "windows-latest" ]

[[jobs]]
name = "package"
steps = [ "Verify clean default and all-feature Cargo packages", "Retain verified Cargo package", "Upload verified Cargo package" ]
runner-labels = [ "ubuntu-latest" ]
