schema = 1
repository = "acgetchell/delaunay"
package = "delaunay"
workflow = ".github/workflows/ci.yml"
workflow-name = "CI"
branch = "main"
artifact-prefix = "cargo-package"
guarantee = "cargo-archive"
path-in-vcs = ""

[signing-job]
name = "sign-package"
steps = [ "Authenticate the original package handoff", "Sign the original Cargo manifest", "Retain the original signature", "Upload signed Cargo evidence" ]

[[jobs]]
name = "portable"
steps = [ "Run portable checks" ]
runner-labels = [ "ubuntu-latest" ]

[[jobs]]
name = "prepare (ubuntu-latest)"
steps = [ "Set up shared tooling" ]
runner-labels = [ "ubuntu-latest" ]

[[jobs]]
name = "prepare (macos-latest)"
steps = [ "Set up shared tooling" ]
runner-labels = [ "macos-latest" ]

[[jobs]]
name = "prepare (windows-latest)"
steps = [ "Set up shared tooling" ]
runner-labels = [ "windows-latest" ]

[[jobs]]
name = "native-python-docs (ubuntu-latest)"
steps = [ "Set up shared tooling", "Verify native Rust host", "Run native validation" ]
runner-labels = [ "ubuntu-latest" ]

[[jobs]]
name = "native-rust-builds (ubuntu-latest)"
steps = [ "Set up shared tooling", "Verify native Rust host", "Run native validation" ]
runner-labels = [ "ubuntu-latest" ]

[[jobs]]
name = "native-rust-integrations (ubuntu-latest)"
steps = [ "Set up shared tooling", "Verify native Rust host", "Run native validation" ]
runner-labels = [ "ubuntu-latest" ]

[[jobs]]
name = "native-rust-tests (ubuntu-latest)"
steps = [ "Set up shared tooling", "Verify native Rust host", "Run native validation" ]
runner-labels = [ "ubuntu-latest" ]

[[jobs]]
name = "native-python-docs (macos-latest)"
steps = [ "Set up shared tooling", "Verify native Rust host", "Run native validation" ]
runner-labels = [ "macos-latest" ]

[[jobs]]
name = "native-rust-builds (macos-latest)"
steps = [ "Set up shared tooling", "Verify native Rust host", "Run native validation" ]
runner-labels = [ "macos-latest" ]

[[jobs]]
name = "native-rust-integrations (macos-latest)"
steps = [ "Set up shared tooling", "Verify native Rust host", "Run native validation" ]
runner-labels = [ "macos-latest" ]

[[jobs]]
name = "native-rust-tests (macos-latest)"
steps = [ "Set up shared tooling", "Verify native Rust host", "Run native validation" ]
runner-labels = [ "macos-latest" ]

[[jobs]]
name = "native-python-docs (windows-latest)"
steps = [ "Set up shared tooling", "Verify native Rust host", "Run native validation" ]
runner-labels = [ "windows-latest" ]

[[jobs]]
name = "native-rust-builds (windows-latest)"
steps = [ "Set up shared tooling", "Verify native Rust host", "Run native validation" ]
runner-labels = [ "windows-latest" ]

[[jobs]]
name = "native-rust-integrations (windows-latest)"
steps = [ "Set up shared tooling", "Verify native Rust host", "Run native validation" ]
runner-labels = [ "windows-latest" ]

[[jobs]]
name = "native-rust-tests (windows-latest)"
steps = [ "Set up shared tooling", "Verify native Rust host", "Run native validation" ]
runner-labels = [ "windows-latest" ]

[[jobs]]
name = "package"
steps = [ "Verify clean default and all-feature Cargo packages", "Retain verified Cargo package", "Upload verified Cargo package" ]
runner-labels = [ "ubuntu-latest" ]
