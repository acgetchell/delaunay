# One current harness for both releases; counts are scientific policy, never inferred from raw lengths.
schema = 4
harness-mode = "common"
backend = "export"
minimum-release = "v0.8.2"
sources = [ "src/**/*.rs", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml" ]
harness = [ "benches/ci_performance_suite.rs", "benches/circumsphere_containment.rs", "benches/locate.rs", "benches/common/bench_utils.rs", "benches/common/flip_fixtures.rs", "benches/common/flip_workflows.rs", ".cargo/config.toml" ]
workloads = [ "benches/ci_performance_suite.rs", "benches/circumsphere_containment.rs", "benches/locate.rs", "benches/common/flip_fixtures.rs" ]
raw-files = [ "tukey.json" ]
saved-sample = "retained"
statistics = [ "mean", "median" ]
confidence-level = 0.95
unit = "ns"
timeout = 21600
compatible = [ "context.os", "context.architecture", "context.cpu" ]

[context]
suite = "release-signal"
profile = "perf"

[probes]
cargo = [ "cargo", "--version" ]
rustc = [ "rustc", "--version", "--verbose" ]
build-policy = [ "python", "-c", "import json,os,tomllib; from pathlib import Path; d=tomllib.loads(Path('Cargo.toml').read_text()); print(json.dumps({'cargo':{k:d.get(k) for k in ('profile','features')},'environment':{k:v for k,v in os.environ.items() if k in ('RUSTFLAGS','CARGO_ENCODED_RUSTFLAGS','RUSTDOCFLAGS','CARGO_ENCODED_RUSTDOCFLAGS','RUSTC','RUSTC_WRAPPER','RUSTC_WORKSPACE_WRAPPER','RUSTUP_TOOLCHAIN','CARGO_INCREMENTAL','CARGO_BUILD_TARGET','CARGO_BUILD_RUSTFLAGS') or k.startswith('CARGO_PROFILE_') or (k.startswith('CARGO_TARGET_') and k.endswith(('_RUSTFLAGS','_LINKER','_RUNNER')))}},sort_keys=True))" ]

criterion = [ "python", "-c", "import json,tomllib; from pathlib import Path; d=tomllib.loads(Path('Cargo.lock').read_text(encoding='utf-8')); print(json.dumps([p for p in d['package'] if p['name']=='criterion'],sort_keys=True))" ]

[phases.baseline]
command = [ "cargo", "bench", "--locked", "--profile", "perf", "--bench", "ci_performance_suite", "--bench", "circumsphere_containment", "--bench", "locate", "--", "--save-baseline=retained", "--noplot" ]
gate = [ "cargo", "bench", "--locked", "--profile", "perf", "--bench", "ci_performance_suite", "--bench", "circumsphere_containment", "--bench", "locate", "--", "--test" ]
environment = { CRITERION_HOME = "target/criterion", CARGO_TARGET_DIR = "target", CARGO_INCREMENTAL = "0" }

