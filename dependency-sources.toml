# Shared release validation owns registry and exact development-source checks.
schema = 1

[projects.python]
ecosystem = "python"
directory = "."
release-owned = [ "." ]

[projects.rust]
ecosystem = "cargo"
directory = "."
release-owned = [ "." ]

[projects.checkpoint-fixture]
ecosystem = "cargo"
directory = "tests/fixtures/checkpoint_no_float_roundtrip"
cargo-owner = "rust"

# Edit this selection, preview with `just dependency-source tooling`, then apply.
[sources.tooling]
project = "python"
package = "research-repo-tools"
version = "0.2.8"

# Native payload pins follow the shared actionlint policy.
[source-builds]
packages = [ "actionlint-py", "pyyaml", "ruamel-yaml-clib" ]
group = "build"

[[source-builds.external]]
package = "actionlint-py"
