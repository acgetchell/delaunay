# nextest configuration for delaunay
# See: https://nexte.st/book/configuration.html

[profile.default]
# Run tests in parallel by default
test-threads = "num-cpus"

# Show test output for failures
failure-output = "immediate-final"
success-output = "never"

# Continue running tests after first failure
fail-fast = false

# Retry flaky tests (useful for proptests)
retries = 0

# Default-suite tests should stay under the 10-second per-test budget. Longer
# deterministic correctness tests belong behind the slow-tests feature.
slow-timeout = { period = "10s", terminate-after = 1 }

[profile.ci]
# CI profile: optimized for GitHub Actions
# Inherits from default profile

# Show more verbose output in CI
failure-output = "immediate-final"
success-output = "never"

# Continue running all tests even if some fail
fail-fast = false

# Retry flaky tests once in CI (helps with proptests and timing-sensitive tests)
retries = 1

# Enforce the default-suite 10-second per-test budget in CI.
slow-timeout = { period = "10s", terminate-after = 1 }

# JUnit report configuration
[profile.ci.junit]
# Store reports in test-results directory (matches workflow)
path = "test-results/junit.xml"

# Store test output in JUnit report
store-success-output = false
store-failure-output = true

[[profile.ci.overrides]]
# These promoted 4D property families finish with little or no margin under
# the 10-second budget on Windows runners. Keep the normal budget elsewhere.
platform = 'cfg(windows)'
filter = '''
(
    binary(=proptest_convex_hull)
    | binary(=proptest_facet)
    | binary(=proptest_orientation)
    | binary(=proptest_simplex)
    | binary(=proptest_tds)
) & test(/_4d$/)
'''
slow-timeout = { period = "60s", terminate-after = 1 }

[[profile.ci.overrides]]
# These two 4D Delaunay properties also sit at the Windows timeout boundary;
# other 4D properties in the same binary retain the normal 10-second budget.
platform = 'cfg(windows)'
filter = '''
binary(=proptest_delaunay_triangulation)
& test(/^(prop_duplicate_coordinates_rejected_4d|prop_insertion_order_robustness_4d)$/)
'''
slow-timeout = { period = "60s", terminate-after = 1 }

[[profile.ci.overrides]]
# A single compact T^3 periodic-image construction can cross the default
# budget on Windows. Each test retains one construction so other platforms
# keep the normal watchdog and the exception remains limited to this fixture.
platform = 'cfg(windows)'
filter = '''
binary(=triangulation_builder)
& test(/^(test_builder_toroidal_t3_compact_quotient_validates_topology_and_delaunay|test_builder_toroidal_t3_compact_quotient_handles_reversed_input|test_builder_toroidal_t3_compact_quotient_handles_orientation_reversing_map)$/)
'''
slow-timeout = { period = "60s", terminate-after = 1 }

[profile.debug]
# Debug assertions and overflow checks make exact-geometry paths slower than
# their release counterparts. Inherit the default 10-second budget and grant
# extra headroom only to named platform-sensitive cases.
inherits = "ci"
retries = 0

[[profile.debug.overrides]]
filter = 'test(=builder::tests::test_builder_toroidal_t2_smoke) | test(=builder::tests::test_builder_toroidal_accepts_matching_explicit_global_topology)'
slow-timeout = { period = "60s", terminate-after = 1 }

[[profile.debug.overrides]]
# These randomized 5D agreement checks finish at the 10-second boundary on
# Windows runners. Keep the normal budget on other platforms.
platform = 'cfg(windows)'
filter = '''
test(=geometry::util::simplex_lp::tests::optimized_intersection_agrees_with_legacy_random_5d)
| test(=validation::tests::randomized_full_report_matches_brute_force_5d)
'''
slow-timeout = { period = "60s", terminate-after = 1 }

[[profile.debug.overrides]]
# The optimized 5D intersection agreement check also reaches the 10-second
# boundary on macOS ARM runners. Keep the exception limited to that test.
platform = 'cfg(all(target_os = "macos", target_arch = "aarch64"))'
filter = 'test(=geometry::util::simplex_lp::tests::optimized_intersection_agrees_with_legacy_random_5d)'
slow-timeout = { period = "60s", terminate-after = 1 }

[profile.coverage]
# Coverage runs execute LLVM-instrumented binaries in parallel, so exact
# predicate regressions need more headroom than the normal CI profile while
# still failing genuine hangs.
inherits = "ci"
retries = 0
slow-timeout = { period = "300s", terminate-after = 1 }

[profile.slow]
# Slow correctness and regression tests are intentionally outside the default
# 10-second per-test budget. Keep a finite watchdog so hangs still fail.
failure-output = "immediate-final"
success-output = "never"
fail-fast = false
retries = 0
slow-timeout = { period = "900s", terminate-after = 1 }

# Full Levels 1-5 validation at the bounded 2D-5D regression scales is
# CPU-intensive. Give each large-scale case the complete worker pool so
# concurrent slow fixtures cannot consume its 600-second internal wall-clock
# budget. Broader Level 4 and Level 5 performance work remains in #482/#483.
[[profile.slow.overrides]]
filter = 'test(debug_large_scale_)'
threads-required = "num-cpus"
