[build-system]
requires = [ "setuptools>=83.0.0", "wheel" ]
build-backend = "setuptools.build_meta"

[project]
name = "delaunay-scripts"
version = "0.8.2"
description = "Python utility scripts for the delaunay Rust library"
readme = "scripts/README.md"
requires-python = ">=3.14"
license = "BSD-3-Clause"
license-files = [ "LICENSE" ]
authors = [ { name = "Adam Getchell", email = "adam@adamgetchell.org" } ]
keywords = [ "delaunay", "triangulation", "benchmarking", "utilities" ]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Benchmarking",
]

# Project dependencies
dependencies = [
    "packaging>=26.2",
    "pypdf>=6.0.0",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.10.4",
    "ruff>=0.16.1",
    "ty>=0.0.66",
]

[project.urls]
"Homepage" = "https://github.com/acgetchell/delaunay"
"Documentation" = "https://docs.rs/delaunay"
"Repository" = "https://github.com/acgetchell/delaunay"
"Bug Tracker" = "https://github.com/acgetchell/delaunay/issues"

# Configure scripts as entry points for command-line usage
[project.scripts]
benchmark-utils = "benchmark_utils:main"
hardware-utils = "hardware_utils:main"
notebook-check = "notebook_check:main"
paper-pdf-check = "paper_check:main"
paper-pdf-normalize = "paper_pdf_normalize:main"
paper-source-date-epoch = "paper_source_date:main"
publish-readme-performance = "publish_readme_performance:main"

# Configure setuptools to find packages in scripts/ directory
[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = [
    "benchmark_models",
    "benchmark_utils",
    "hardware_utils",
    "notebook_check",
    "notebook_utils",
    "notebook_validation",
    "notebook_validation_rendering",
    "notebook_visualization",
    "paper_check",
    "paper_pdf_normalize",
    "paper_source_date",
    "performance_artifacts",
    "publish_readme_performance",
    "subprocess_utils",
]

[tool.ruff]
line-length = 160
src = [ "scripts" ]
# Notebooks have a separate extracted-code validator.
include = [ "*.py", "*.pyi" ]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
    "C90",
    "I",
    "N",
    "UP",
    "YTT",
    "ASYNC",
    "S",
    "BLE",
    "FBT",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "FA",
    "T10",
    "EM",
    "EXE",
    "FIX",
    "FLY",
    "FURB",
    "ISC",
    "ICN",
    "LOG",
    "G",
    "INP",
    "PERF",
    "PIE",
    "T20",
    "PYI",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "SLOT",
    "TC",
    "TID",
    "TD",
    "ARG",
    "PTH",
    "ERA",
    "PD",
    "PGH",
    "PL",
    "TRY",
    "NPY",
    "RUF",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
]
fixable = [ "ALL" ]
unfixable = [  ]
ignore = [
    # Formatter conflicts
    "COM812", # Trailing comma missing (conflicts with formatter)
    "ISC001", # Implicitly concatenated string literals (conflicts with formatter)

    # CLI script patterns - these are appropriate design choices for command-line tools
    # "PLR0912" - Re-enabled: Too many branches - now enforced to maintain code quality
    # "PLR0913" - Re-enabled: Too many arguments - catch constructor complexity issues
    # "PLR0915" - Re-enabled: Too many statements - now enforced after refactoring complex methods
    "PLR2004", # Magic value used in comparison - acceptable for CLI constants and thresholds
    "FBT001", # Boolean-typed positional argument - appropriate for CLI flag arguments
    "FBT002", # Boolean default positional argument - standard CLI pattern
    # "BLE001" - Re-enabled: broad exception catches must name recoverable error families
    # "S603" - Re-enabled: subprocess call: check for execution of untrusted input - now using secure subprocess wrappers
    # "S607" - Re-enabled: Starting a process with a partial executable path - now using full paths
    "T201", # print found - appropriate for CLI output and user feedback
    "TRY300", # Consider moving statement to else block - acceptable control flow for CLI scripts
    "TRY301", # Abstract raise to inner function - acceptable for straightforward CLI error handling
    "ARG001", # Unused function argument - common in signal handlers and callback functions
    "ERA001", # Found commented-out code - acceptable for explanatory comments in CLI tools
    "EXE001", # Shebang is present but file is not executable - handled by packaging/deployment
    # "S110" - Re-enabled: try-except-pass detected - now enforced to improve error handling
    "PTH123", # open() should be replaced by Path.open() - acceptable for system file access
    "N806", # Variable in function should be lowercase - acceptable for constants and ANSI color codes
    "F841", # Local variable assigned but never used - acceptable for color constants in CLI scripts
    "EM102", # Exception must not use f-string - acceptable for dynamic error messages in CLI tools
    "TRY003", # Avoid specifying long messages outside exception class - acceptable for CLI error reporting
    "PLW2901", # for loop variable overwritten - acceptable for line processing in CLI scripts
]

[tool.ruff.lint.per-file-ignores]
# Test names and class groupings already document behavior; avoid requiring
# docstrings for each pytest case while still checking production scripts.
"**/tests/test_*.py" = [ "S101", "SLF001", "D101", "D102", "D103" ]
# Standalone static-analysis fixtures are not packages or public APIs. Keep
# exception/process/write violations intact, without disabling typing or imports.
"tests/semgrep/scripts/tests/python_exceptions.py" = [
    "INP001",
    "D103",
    "BLE001",
    "EM101",
    "S110",
    "S607",
    "SIM105",
    "TRY002",
]
"tests/semgrep/scripts/tests/python_parse_boundaries.py" = [ "INP001", "D103" ]
"tests/semgrep/scripts/tests/python_style.py" = [ "INP001", "S202", "S605", "S607", "SIM115", "UP015" ]

[tool.ruff.lint.mccabe]
max-complexity = 10

# Import sorting and organization configuration
[tool.ruff.lint.isort]
known-first-party = [
    "benchmark_models",
    "benchmark_utils",
    "hardware_utils",
    "notebook_check",
    "paper_check",
    "paper_pdf_normalize",
    "paper_source_date",
    "performance_artifacts",
    "publish_readme_performance",
    "subprocess_utils",
]
force-single-line = false
split-on-trailing-comma = true
combine-as-imports = true
order-by-type = true
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
# Organize imports: standard library, third-party, first-party, local

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Pylint configuration removed - now using ruff exclusively for Python linting
# Ruff provides faster, more comprehensive linting with better maintenance

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [ "-ra", "--strict-markers", "--strict-config", "--color=yes" ]
testpaths = [ "scripts/tests" ]
python_files = [ "test_*.py", "*_test.py" ]
python_classes = [ "Test*" ]
python_functions = [ "test_*" ]

[tool.rumdl]
line-length = 160
disable = [
    "MD018",
    "MD024",
    "MD029",
    "MD033",
    "MD037",
    "MD038",
    "MD041",
    "MD060",
]

[tool.rumdl.MD013]
line-length = 160

[dependency-groups]
tooling = [ "research-repo-tools==0.1.7" ]
dev = [
    { include-group = "tooling" },
    "actionlint-py>=1.7.12.24",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.1",
    "semgrep>=1.172.0",
    "shellcheck-py>=0.11.0.1",
    "shfmt-py>=4.0.0",
    "ty>=0.0.66",
    "yamllint>=1.38.0",
]
notebooks = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "polars>=1.43.2",
    "plotly>=6.9.0",
]

[tool.uv]
required-version = "==0.12.23"
# Semgrep 1.172.0 still pins vulnerable mcp 1.23.3. Keep the patched override
# until Semgrep's published dependency constraint moves to mcp 1.28.1 or later.
override-dependencies = [ "mcp==1.28.1" ]

[tool.research-repo-tools]
schema = 1

[tool.research-repo-tools.changelog]
owner = "acgetchell"
repository = "delaunay"
formatter = "docs/templates/changelog_format.toml"

[tool.research-repo-tools.toolchain.cargo]
cargo-audit = "0.22.2"
cargo-edit = "0.13.13"
cargo-llvm-cov = "0.9.1"
cargo-machete = "0.9.2"
cargo-nextest = "0.9.146"
clippy-sarif = "0.8.0"
dprint = "0.60.1"
git-cliff = "2.14.2"
rumdl = "0.2.78"
samply = "0.13.1"
sarif-fmt = "0.8.0"
taplo-cli = "0.10.0"
tectonic = "0.17.0"
tex-fmt = "0.5.7"
typos-cli = "1.50.3"
zizmor = "1.30.1"

[tool.research-repo-tools.semgrep]
config = "semgrep.yaml"
fixtures = "tests/semgrep"
namespace = "delaunay."

[tool.research-repo-tools.zizmor]
persona = "regular"

[tool.research-repo-tools.release]
tag-policy = "canonical-stable"
required-files = [ "Cargo.lock", "pyproject.toml", "uv.lock", "CITATION.cff", "README.md", "REFERENCES.md", "CHANGELOG.md" ]
exclude = [ "docs/archive/**", "docs/performance.md", "benches/PERFORMANCE_RESULTS.md" ]

[[tool.research-repo-tools.release.rules]]
path = "CITATION.cff"
pattern = '^doi: (?P<value>[^\s]+)[ \t]*\r?$'
value = "10.5281/zenodo.16931097"

[[tool.research-repo-tools.release.rules]]
path = "README.md"
pattern = 'https://github\.com/acgetchell/delaunay/blob/(?P<value>v[0-9]+\.[0-9]+\.[0-9]+)/LICENSE'
source = "tag"
count = 2
