name: Action policy fixtures
on:
  workflow_dispatch:
  # ruleid: delaunay.github-actions.no-pull-request-target
  pull_request_target:

jobs:
  approved-shared-workflow:
    # ok: delaunay.github-actions.external-action-sha-pinned
    # allowlist: approved
    # ok: delaunay.github-actions.external-action-version-comment
    uses: acgetchell/research-repo-tools/.github/workflows/dependabot-approve.yml@cbb2ea6dee8866b3f0547bca935aef48fdd71707 # reviewed 2026-10-04

  unapproved-shared-workflow:
    # allowlist: rejected
    uses: acgetchell/research-repo-tools/.github/workflows/unreviewed.yml@cbb2ea6dee8866b3f0547bca935aef48fdd71707 # reviewed 2026-10-04

  moving-shared-workflow:
    # ruleid: delaunay.github-actions.external-action-sha-pinned
    uses: acgetchell/research-repo-tools/.github/workflows/dependabot-approve.yml@main

  undocumented-shared-workflow:
    # ruleid: delaunay.github-actions.external-action-version-comment
    uses: acgetchell/research-repo-tools/.github/workflows/dependabot-approve.yml@cbb2ea6dee8866b3f0547bca935aef48fdd71707

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Allowed pinned action
        # ok: delaunay.github-actions.external-action-sha-pinned
        # allowlist: approved
        # ok: delaunay.github-actions.external-action-version-comment
        # ok: delaunay.github-actions.checkout-persist-credentials-false
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout without explicit credential persistence
        # ruleid: delaunay.github-actions.checkout-persist-credentials-false
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Moving tag action
        # ruleid: delaunay.github-actions.external-action-sha-pinned
        uses: actions/checkout@v6

      - name: Unapproved external action
        # allowlist: rejected
        uses: unapproved/example-action@1111111111111111111111111111111111111111 # v1.0.0

      - name: Reviewed crates.io authentication action
        # allowlist: approved
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Unreviewed crates.io authentication revision
        # allowlist: rejected
        uses: rust-lang/crates-io-auth-action@1111111111111111111111111111111111111111 # unreviewed

      - name: Unreviewed crates.io authentication fork
        # allowlist: rejected
        uses: unreviewed/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # unreviewed

      - name: Missing readable version comment
        # ruleid: delaunay.github-actions.external-action-version-comment
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae

      - name: Allowed setup-python action
        # allowlist: approved
        # ok: delaunay.github-actions.external-action-sha-pinned
        # ok: delaunay.github-actions.external-action-version-comment
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0

      - name: Local action
        # ok: delaunay.github-actions.external-action-sha-pinned
        # allowlist: approved
        # ok: delaunay.github-actions.external-action-version-comment
        uses: ./.github/actions/local-action

      - name: Interpolated github-script
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # ruleid: delaunay.github-actions.github-script-no-expression-interpolation
          script: |
            core.info("${{ github.ref_name }}");

      - name: Env-backed github-script
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SAFE_REF_NAME: ${{ github.ref_name }}
        with:
          # ok: delaunay.github-actions.github-script-no-expression-interpolation
          script: |
            core.info(process.env.SAFE_REF_NAME);

      - name: Unlocked uv sync
        # ruleid: delaunay.github-actions.uv-sync-locked-in-workflows
        run: uv sync

      - name: Locked uv sync
        # ok: delaunay.github-actions.uv-sync-locked-in-workflows
        run: uv sync --locked

      - name: Unlocked uv run
        # ruleid: delaunay.github-actions.uv-run-locked-in-workflows
        run: uv run benchmark-utils compare

      - name: Unlocked uv run in a block
        run: |
          # ruleid: delaunay.github-actions.uv-run-locked-in-workflows
          uv run benchmark-utils compare

      - name: Locked uv run
        # ok: delaunay.github-actions.uv-run-locked-in-workflows
        run: uv run --locked benchmark-utils compare

      - name: Locked uv run in a block
        run: |
          # ok: delaunay.github-actions.uv-run-locked-in-workflows
          uv run --locked benchmark-utils compare

  syntax-forms:
    runs-on: ubuntu-latest
    # Preserve scalar quote styles: they are the policy cases under test.
    # pretty-yaml-ignore
    steps:
      - name: Quoted moving tag
        # ruleid: delaunay.github-actions.external-action-sha-pinned
        uses: "actions/cache@v5"
      - name: Single-quoted moving tag
        # ruleid: delaunay.github-actions.external-action-sha-pinned
        uses: 'actions/cache@v5'
      - name: Quoted unapproved action
        # allowlist: rejected
        uses: "unapproved/example-action@1111111111111111111111111111111111111111" # v1
      - name: Single-quoted unapproved action
        # allowlist: rejected
        uses: 'unapproved/example-action@1111111111111111111111111111111111111111' # v1
      - name: Quoted missing version
        # ruleid: delaunay.github-actions.external-action-version-comment
        uses: "actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae"
      - name: Single-quoted missing version
        # ruleid: delaunay.github-actions.external-action-version-comment
        uses: 'actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae'
      - name: Quoted reviewed action
        # ok: delaunay.github-actions.external-action-sha-pinned
        # allowlist: approved
        # ok: delaunay.github-actions.external-action-version-comment
        uses: "rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18" # v1.0.5
      - name: Single-quoted reviewed action
        # ok: delaunay.github-actions.external-action-sha-pinned
        # allowlist: approved
        # ok: delaunay.github-actions.external-action-version-comment
        uses: 'rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18' # v1.0.5

      # ruleid: delaunay.github-actions.external-action-sha-pinned
      - uses: actions/cache@v5
      # ruleid: delaunay.github-actions.external-action-sha-pinned
      - uses: "actions/cache@v5"
      # ruleid: delaunay.github-actions.external-action-sha-pinned
      - uses: 'actions/cache@v5'
      # allowlist: rejected
      - uses: unapproved/example-action@1111111111111111111111111111111111111111 # v1
      # allowlist: rejected
      - uses: "unapproved/example-action@1111111111111111111111111111111111111111" # v1
      # allowlist: rejected
      - uses: 'unapproved/example-action@1111111111111111111111111111111111111111' # v1
      # ruleid: delaunay.github-actions.external-action-version-comment
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
      # ruleid: delaunay.github-actions.external-action-version-comment
      - uses: "actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae"
      # ruleid: delaunay.github-actions.external-action-version-comment
      - uses: 'actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae'
      # ok: delaunay.github-actions.external-action-sha-pinned
      # allowlist: approved
      # ok: delaunay.github-actions.external-action-version-comment
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      # ok: delaunay.github-actions.external-action-sha-pinned
      # allowlist: approved
      # ok: delaunay.github-actions.external-action-version-comment
      - uses: "rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18" # v1.0.5
      # ok: delaunay.github-actions.external-action-sha-pinned
      # allowlist: approved
      # ok: delaunay.github-actions.external-action-version-comment
      - uses: 'rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18' # v1.0.5
      # allowlist: rejected
      - uses: "rust-lang/crates-io-auth-action@1111111111111111111111111111111111111111" # unreviewed
      # ok: delaunay.github-actions.external-action-sha-pinned
      # allowlist: approved
      # ok: delaunay.github-actions.external-action-version-comment
      - uses: './.github/actions/local-action'
      # ok: delaunay.github-actions.external-action-sha-pinned
      # allowlist: approved
      # ok: delaunay.github-actions.external-action-version-comment
      - uses: "docker://example:latest"
